name: Forma
options:
  bundleIdPrefix: com.michal0ss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl
  xcodeVersion: "2600"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Core:
    path: Packages/Core
targets:
  Forma:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Forma.entitlements
    dependencies:
      - package: Core
        product: Contracts
      - package: Core
        product: DesignSystem
      - package: Core
        product: Analysis
      - package: Core
        product: Health
      - package: Core
        product: Insights
      - package: Core
        product: Plan
      - package: Core
        product: Coaching
      - package: Core
        product: Content
      - package: Core
        product: LiveSet
      - package: Core
        product: Onboarding
      - package: Core
        product: API
      - package: Core
        product: CoachVoice
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: hackGYM
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Kamera służy do nagrywania ćwiczenia, które analizujemy na telefonie. Film nie opuszcza urządzenia."
        NSMicrophoneUsageDescription: "Mikrofon jest potrzebny, żeby aparat mógł nagrać film z ćwiczeniem i żebyś mógł rozmawiać z trenerem głosem. Nagranie głosu nie jest zapisywane ani wysyłane."
        NSSpeechRecognitionUsageDescription: "Rozpoznajemy Twoją mowę na telefonie, żeby zamienić pytanie do trenera na tekst. Do serwera trafia tylko tekst, nie nagranie."
        # Only HealthDebugSeeder (#if DEBUG) writes to Health; the post-compile script below removes this key from Release.
        NSHealthUpdateUsageDescription: "Tylko w wersji testowej: zapis przykładowych danych do Zdrowia, żeby sprawdzić odczyt."
        NSHealthShareUsageDescription: "Odczytujemy sen, tętno spoczynkowe, zmienność rytmu serca oraz kroki, kalorie aktywne, dystans, minuty ćwiczeń i piętra, żeby dopasować rekomendację dnia i pokazać twoje dane zdrowotne."
        NSLocationWhenInUseUsageDescription: "Lokalizacja pomaga znaleźć fizjoterapeutów w pobliżu."
        NSLocalNetworkUsageDescription: "Aplikacja łączy się z serwerem deweloperskim w sieci lokalnej."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        FormaAPIURL: $(FORMA_API_URL)
        FormaAPIToken: $(FORMA_API_TOKEN)
    postCompileScripts:
      - name: Remove Health write usage from Release
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSHealthUpdateUsageDescription" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false
    entitlements:
      path: App/Forma.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGET_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
